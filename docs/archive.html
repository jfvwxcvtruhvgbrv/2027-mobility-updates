fetch('search-index.json').then(r=>r.json()).then(ix=>{const q=document.getElementById('aq'),o=document.getElementById('ares');
const A={car:'자동차',mobility:'모빌리티',research:'리서치',event:'이벤트'};const esc=s=>String(s).replace(/</g,'&lt;');
